name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use fixed signing key
        run: |
          test -f debug.keystore || { echo 'debug.keystore is missing from the repo. Upload it so updates keep your data.'; exit 1; }
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Create Android project
        run: |
          mkdir www && cp index.html www/
          sed -i "s|__UPDATE_URL__|https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/index.html|" www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Forge com.forge.discipline --web-dir www
          node -e "const f='capacitor.config.json',c=require('./'+f);c.backgroundColor='#08090b';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i 's|@drawable/splash|@color/forge_bg|g' android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="windowActionBar">false</item>|&<item name="android:statusBarColor">#08090b</item><item name="android:navigationBarColor">#08090b</item><item name="android:windowBackground">@color/forge_bg</item>|' android/app/src/main/res/values/styles.xml
      - name: Add widgets, icon and native bridge
        run: |
          A=android/app/src/main
          J=$A/java/com/forge/discipline
          mkdir -p $A/res/drawable $A/res/layout $A/res/xml $A/res/values $A/res/mipmap-anydpi-v26
          cat > $J/MainActivity.java <<'EOT'
          package com.forge.discipline;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              lockMode(getIntent());
              final Context ctx = getApplicationContext();
              final MainActivity me = this;
              getBridge().getWebView().addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void push(String json) {
                  ctx.getSharedPreferences("forge", 0).edit().putString("data", json).apply();
                  ForgeWidget.refresh(ctx);
                }
                @JavascriptInterface
                public void saveFull(String json) {
                  ctx.getSharedPreferences("forge", 0).edit().putString("full", json).apply();
                }
                @JavascriptInterface
                public String loadFull() {
                  return ctx.getSharedPreferences("forge", 0).getString("full", "");
                }
                @JavascriptInterface
                public void share(final String text) {
                  me.runOnUiThread(new Runnable() {
                    public void run() {
                      Intent s = new Intent(Intent.ACTION_SEND);
                      s.setType("text/plain");
                      s.putExtra(Intent.EXTRA_SUBJECT, "Forge backup");
                      s.putExtra(Intent.EXTRA_TEXT, text);
                      me.startActivity(Intent.createChooser(s, "Save to"));
                    }
                  });
                }
                @JavascriptInterface
                public String pending() {
                  Intent in = me.getIntent();
                  String g = in == null ? null : in.getStringExtra("go");
                  if (in != null) in.removeExtra("go");
                  return g == null ? "" : g;
                }
                @JavascriptInterface
                public void setAlarms(String json) {
                  ForgeAlarm.save(ctx, json);
                }
                @JavascriptInterface
                public void askNotif() {
                  if (Build.VERSION.SDK_INT >= 33) {
                    me.runOnUiThread(new Runnable() {
                      public void run() {
                        ActivityCompat.requestPermissions(me, new String[]{"android.permission.POST_NOTIFICATIONS"}, 7712);
                      }
                    });
                  }
                }
                @JavascriptInterface
                public void stopAlarm() {
                  ForgeAlarm.stop(ctx);
                  me.runOnUiThread(new Runnable() {
                    public void run() {
                      if (Build.VERSION.SDK_INT >= 27) {
                        me.setShowWhenLocked(false);
                        me.setTurnScreenOn(false);
                      }
                    }
                  });
                }
                @JavascriptInterface
                public void syncSteps() {
                  me.runOnUiThread(new Runnable() {
                    public void run() {
                      ForgeHealth.sync(me, me.getBridge().getWebView());
                    }
                  });
                }
                @JavascriptInterface
                public void connectHealth() {
                  me.runOnUiThread(new Runnable() {
                    public void run() {
                      ForgeHealth.request(me);
                    }
                  });
                }
              }, "ForgeNative");
            }

            void lockMode(Intent i) {
              boolean al = i != null && "alarm".equals(i.getStringExtra("go"));
              if (Build.VERSION.SDK_INT >= 27) {
                setShowWhenLocked(al);
                setTurnScreenOn(al);
              }
            }

            @Override
            public void onNewIntent(Intent i) {
              super.onNewIntent(i);
              setIntent(i);
              lockMode(i);
            }

            @Override
            public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
              super.onRequestPermissionsResult(code, perms, res);
              if (code == 7711) ForgeHealth.sync(this, getBridge().getWebView());
            }
          }
          EOT
          cat > $J/ForgeWidget.java <<'EOT'
          package com.forge.discipline;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;
          import org.json.JSONObject;

          public class ForgeWidget extends AppWidgetProvider {
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) { refresh(c); }

            static PendingIntent open(Context c, String go, int code) {
              Intent i = new Intent(c, MainActivity.class);
              i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              i.putExtra("go", go);
              return PendingIntent.getActivity(c, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            static void refresh(Context c) {
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              JSONObject d;
              try { d = new JSONObject(c.getSharedPreferences("forge", 0).getString("data", "{}")); } catch (Exception e) { d = new JSONObject(); }
              long start = d.optLong("start", 0);
              long days = start > 0 ? Math.max(0, (System.currentTimeMillis() - start) / 86400000L) : 0;
              int done = d.optInt("done", 0);
              int total = Math.max(1, d.optInt("total", 1));
              int prot = d.optInt("prot", 0);
              int goal = Math.max(1, d.optInt("goal", 1));
              for (int id : m.getAppWidgetIds(new ComponentName(c, ForgeWidget.class))) {
                RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_forge);
                v.setTextViewText(R.id.w_rank, d.optString("rank", "Recruit"));
                v.setTextViewText(R.id.w_days, String.valueOf(days));
                v.setTextViewText(R.id.w_tasks_txt, "Tasks " + done + "/" + total);
                v.setProgressBar(R.id.w_tasks_bar, 100, Math.min(100, done * 100 / total), false);
                v.setTextViewText(R.id.w_prot_txt, "Protein " + prot + "/" + goal + " g");
                v.setProgressBar(R.id.w_prot_bar, 100, Math.min(100, prot * 100 / goal), false);
                v.setOnClickPendingIntent(R.id.w_root, open(c, "", 1));
                v.setOnClickPendingIntent(R.id.w_panic, open(c, "panic", 2));
                m.updateAppWidget(id, v);
              }
              for (int id : m.getAppWidgetIds(new ComponentName(c, ForgeSmall.class))) {
                RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_small);
                v.setTextViewText(R.id.s_days, String.valueOf(days));
                v.setOnClickPendingIntent(R.id.s_root, open(c, "streak", 3));
                v.setOnClickPendingIntent(R.id.s_panic, open(c, "panic", 4));
                m.updateAppWidget(id, v);
              }
            }
          }
          EOT
          cat > $J/ForgeSmall.java <<'EOT'
          package com.forge.discipline;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;

          public class ForgeSmall extends AppWidgetProvider {
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) { ForgeWidget.refresh(c); }
          }
          EOT
          cat > $J/ForgeAlarm.java <<'EOT'
          package com.forge.discipline;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class ForgeAlarm {
            static void save(Context c, String json) {
              c.getSharedPreferences("forge", 0).edit().putString("alarms", json).apply();
              resched(c);
            }

            static JSONArray list(Context c) {
              try {
                return new JSONArray(c.getSharedPreferences("forge", 0).getString("alarms", "[]"));
              } catch (Exception e) {
                return new JSONArray();
              }
            }

            static PendingIntent bc(Context c, int id) {
              Intent i = new Intent(c, ForgeReceiver.class);
              i.setAction("forge.alarm." + id);
              i.putExtra("id", id);
              return PendingIntent.getBroadcast(c, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            static void resched(Context c) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              SharedPreferences p = c.getSharedPreferences("forge", 0);
              String prev = p.getString("sched", "");
              if (prev.length() > 0) {
                for (String s : prev.split(",")) {
                  try {
                    am.cancel(bc(c, Integer.parseInt(s.trim())));
                  } catch (Exception e) {
                  }
                }
              }
              StringBuilder ids = new StringBuilder();
              JSONArray a = list(c);
              for (int k = 0; k < a.length(); k++) {
                JSONObject o = a.optJSONObject(k);
                if (o == null || !o.optBoolean("on", true)) continue;
                long t = next(o.optInt("h"), o.optInt("m"), o.optInt("d"));
                if (t < 0) continue;
                int id = o.optInt("id");
                try {
                  set(c, am, o, id, t);
                  if (ids.length() > 0) ids.append(",");
                  ids.append(id);
                } catch (Exception e) {
                }
              }
              p.edit().putString("sched", ids.toString()).apply();
            }

            static void set(Context c, AlarmManager am, JSONObject o, int id, long t) {
              PendingIntent pi = bc(c, id);
              if (o.optBoolean("a")) {
                Intent open = new Intent(c, MainActivity.class);
                open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                open.putExtra("go", "alarm");
                PendingIntent show = PendingIntent.getActivity(c, id, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                am.setAlarmClock(new AlarmManager.AlarmClockInfo(t, show), pi);
              } else if (Build.VERSION.SDK_INT >= 23) {
                am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
              } else {
                am.set(AlarmManager.RTC_WAKEUP, t, pi);
              }
            }

            static long next(int h, int m, int mask) {
              long now = System.currentTimeMillis() + 5000;
              for (int i = 0; i < 8; i++) {
                Calendar t = Calendar.getInstance();
                t.add(Calendar.DAY_OF_YEAR, i);
                t.set(Calendar.HOUR_OF_DAY, h);
                t.set(Calendar.MINUTE, m);
                t.set(Calendar.SECOND, 0);
                t.set(Calendar.MILLISECOND, 0);
                boolean day = mask == 0 || ((mask >> (t.get(Calendar.DAY_OF_WEEK) - 1)) & 1) == 1;
                if (t.getTimeInMillis() > now && day) return t.getTimeInMillis();
              }
              return -1;
            }

            static void fire(Context c, int id) {
              JSONArray a = list(c);
              for (int k = 0; k < a.length(); k++) {
                JSONObject o = a.optJSONObject(k);
                if (o != null && o.optInt("id") == id) {
                  show(c, id, o.optString("t", "Forge"), o.optBoolean("a"));
                  break;
                }
              }
              resched(c);
            }

            static void show(Context c, int id, String text, boolean alarm) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              String ch = alarm ? "forge_alarm" : "forge_remind";
              if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(ch) == null) {
                NotificationChannel n = new NotificationChannel(ch, alarm ? "Alarms" : "Reminders",
                    alarm ? NotificationManager.IMPORTANCE_HIGH : NotificationManager.IMPORTANCE_DEFAULT);
                if (alarm) {
                  Uri u = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                  n.setSound(u, new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                  n.enableVibration(true);
                  n.setVibrationPattern(new long[]{0, 700, 400, 700});
                }
                nm.createNotificationChannel(n);
              }
              Intent open = new Intent(c, MainActivity.class);
              open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              open.putExtra("go", alarm ? "alarm" : "");
              PendingIntent pi = PendingIntent.getActivity(c, id + 100000, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              NotificationCompat.Builder b = new NotificationCompat.Builder(c, ch)
                  .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                  .setContentTitle(alarm ? "Forge alarm" : "Forge")
                  .setContentText(text)
                  .setPriority(alarm ? NotificationCompat.PRIORITY_MAX : NotificationCompat.PRIORITY_DEFAULT)
                  .setCategory(alarm ? NotificationCompat.CATEGORY_ALARM : NotificationCompat.CATEGORY_REMINDER)
                  .setAutoCancel(true)
                  .setContentIntent(pi);
              if (alarm) b.setFullScreenIntent(pi, true);
              Notification n = b.build();
              if (alarm) n.flags |= Notification.FLAG_INSISTENT;
              nm.notify(id, n);
            }

            static void stop(Context c) {
              ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).cancelAll();
            }
          }
          EOT
          cat > $J/ForgeReceiver.java <<'EOT'
          package com.forge.discipline;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class ForgeReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              String a = i == null ? null : i.getAction();
              if (a == null) return;
              if (a.startsWith("forge.alarm.")) ForgeAlarm.fire(c, i.getIntExtra("id", 0));
              else ForgeAlarm.resched(c);
            }
          }
          EOT
          cat > $J/ForgeHealth.java <<'EOT'
          package com.forge.discipline;

          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.OutcomeReceiver;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import java.lang.reflect.Method;
          import java.time.Instant;
          import java.util.Calendar;
          import java.util.Locale;
          import java.util.concurrent.Executor;
          import java.util.concurrent.atomic.AtomicInteger;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class ForgeHealth {
            static final String PERM = "android.permission.health.READ_STEPS";

            static void js(final Activity a, final WebView w, String json, String status) {
              final String code = "window.onSteps&&window.onSteps(" + JSONObject.quote(json) + "," + JSONObject.quote(status) + ")";
              a.runOnUiThread(new Runnable() {
                public void run() {
                  w.evaluateJavascript(code, null);
                }
              });
            }

            static void request(Activity a) {
              if (Build.VERSION.SDK_INT >= 34) {
                ActivityCompat.requestPermissions(a, new String[]{PERM}, 7711);
              }
            }

            static void finish(Activity a, WebView w, long[] steps, String[] days, String[] err, AtomicInteger left) {
              if (left.decrementAndGet() > 0) return;
              try {
                JSONArray arr = new JSONArray();
                for (int i = 0; i < steps.length; i++) {
                  JSONObject o = new JSONObject();
                  o.put("d", days[i]);
                  o.put("s", steps[i]);
                  arr.put(o);
                }
                js(a, w, arr.toString(), err[0].length() == 0 ? "ok" : "error " + err[0]);
              } catch (Exception e) {
                js(a, w, "[]", "error " + e);
              }
            }

            static void sync(final Activity a, final WebView w) {
              try {
                if (Build.VERSION.SDK_INT < 34) {
                  js(a, w, "[]", "unavail");
                  return;
                }
                if (a.checkSelfPermission(PERM) != PackageManager.PERMISSION_GRANTED) {
                  js(a, w, "[]", "noperm");
                  return;
                }
                final Object mgr = a.getSystemService("healthconnect");
                if (mgr == null) {
                  js(a, w, "[]", "unavail");
                  return;
                }
                final Class<?> reqC = Class.forName("android.health.connect.AggregateRecordsRequest");
                final Class<?> mgrC = Class.forName("android.health.connect.HealthConnectManager");
                final Class<?> aggT = Class.forName("android.health.connect.datatypes.AggregationType");
                final Class<?> rangeC = Class.forName("android.health.connect.TimeRangeFilter");
                final Class<?> instB = Class.forName("android.health.connect.TimeInstantRangeFilter$Builder");
                final Class<?> reqB = Class.forName("android.health.connect.AggregateRecordsRequest$Builder");
                final Object type = Class.forName("android.health.connect.datatypes.StepsRecord").getField("STEPS_COUNT_TOTAL").get(null);
                final Method agg = mgrC.getMethod("aggregate", reqC, Executor.class, OutcomeReceiver.class);
                final int n = 7;
                final long[] steps = new long[n];
                final String[] days = new String[n];
                final String[] err = new String[]{""};
                final AtomicInteger left = new AtomicInteger(n);
                final Executor ex = a.getMainExecutor();
                for (int i = 0; i < n; i++) {
                  final int idx = i;
                  Calendar c = Calendar.getInstance();
                  c.add(Calendar.DAY_OF_YEAR, -i);
                  c.set(Calendar.HOUR_OF_DAY, 0);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  days[i] = String.format(Locale.US, "%04d-%02d-%02d", c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH));
                  long s = c.getTimeInMillis();
                  c.add(Calendar.DAY_OF_YEAR, 1);
                  long e = Math.min(c.getTimeInMillis(), System.currentTimeMillis());
                  Object tb = instB.getConstructor().newInstance();
                  instB.getMethod("setStartTime", Instant.class).invoke(tb, Instant.ofEpochMilli(s));
                  instB.getMethod("setEndTime", Instant.class).invoke(tb, Instant.ofEpochMilli(e));
                  Object filter = instB.getMethod("build").invoke(tb);
                  Object rb = reqB.getConstructor(rangeC).newInstance(filter);
                  reqB.getMethod("addAggregationType", aggT).invoke(rb, type);
                  Object req = reqB.getMethod("build").invoke(rb);
                  agg.invoke(mgr, req, ex, new OutcomeReceiver<Object, Throwable>() {
                    public void onResult(Object r) {
                      try {
                        Object o = r.getClass().getMethod("get", aggT).invoke(r, type);
                        if (o != null) steps[idx] = ((Number) o).longValue();
                      } catch (Throwable t) {
                        err[0] = String.valueOf(t);
                      }
                      finish(a, w, steps, days, err, left);
                    }

                    public void onError(Throwable t) {
                      err[0] = String.valueOf(t);
                      finish(a, w, steps, days, err, left);
                    }
                  });
                }
              } catch (Throwable t) {
                js(a, w, "[]", "error " + t);
              }
            }
          }
          EOT
          cat > $A/res/layout/widget_forge.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
