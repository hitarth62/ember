              android:minWidth="110dp" android:minHeight="110dp" android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_small" android:resizeMode="none"
              android:widgetCategory="home_screen"/>
          EOT
          cat > $A/res/values/forge_colors.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="forge_bg">#08090b</color></resources>
          EOT
          cat > $A/res/drawable/forge_fg.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M54,28 L77,41 L77,67 L54,80 L31,67 L31,41 Z" android:strokeColor="#d4af6a" android:strokeWidth="3" android:fillColor="#22d4af6a"/>
            <path android:pathData="M42,60 L54,67 L66,60" android:strokeColor="#e6c985" android:strokeWidth="3.5" android:strokeLineCap="round" android:strokeLineJoin="round"/>
            <path android:pathData="M42,51 L54,58 L66,51" android:strokeColor="#e6c985" android:strokeWidth="3.5" android:strokeLineCap="round" android:strokeLineJoin="round"/>
          </vector>
          EOT
          for n in ic_launcher ic_launcher_round; do
          cat > $A/res/mipmap-anydpi-v26/$n.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/forge_bg"/>
            <foreground android:drawable="@drawable/forge_fg"/>
          </adaptive-icon>
          EOT
          done
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-permission android:name="android.permission.health.READ_STEPS"/>'
          rec='<receiver android:name=".ForgeWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/forge_widget_info"/></receiver>'
          rec+='<receiver android:name=".ForgeSmall" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/forge_small_info"/></receiver>'
          rec+='<receiver android:name=".ForgeReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.QUICKBOOT_POWERON"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>'
          rec+='<activity-alias android:name=".ViewPermissionUsageActivity" android:exported="true" android:targetActivity=".MainActivity" android:permission="android.permission.START_VIEW_PERMISSION_USAGE"><intent-filter><action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/><category android:name="android.intent.category.HEALTH_PERMISSIONS"/></intent-filter></activity-alias>'
          rec+='<activity-alias android:name=".PermissionsRationaleActivity" android:exported="true" android:targetActivity=".MainActivity"><intent-filter><action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/></intent-filter></activity-alias>'
          assert '</application>' in s and '<application' in s
          s=s.replace('<application',perms+'<application',1).replace('</application>',rec+'</application>')
          open(p,'w').write(s)
          PY
      - name: Build APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build PC app
        run: |
          mkdir desktop && cp index.html desktop/
          sed -i "s|__UPDATE_URL__|https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/index.html|" desktop/index.html
          cd desktop
          cat > main.js <<'EOT'
          const {app,BrowserWindow,Menu,Tray,protocol,nativeImage,ipcMain}=require('electron');
          const path=require('path'),fs=require('fs');
          app.setAppUserModelId('com.forge.discipline');
          protocol.registerSchemesAsPrivileged([{scheme:'app',privileges:{standard:true,secure:true,supportFetchAPI:true,corsEnabled:true}}]);
          let win=null,tray=null,quitting=false;
          const show=()=>{if(win){win.show();win.focus()}};
          if(!app.requestSingleInstanceLock()){app.quit()}else{
            app.on('second-instance',show);
            ipcMain.on('show',show);
            app.on('before-quit',()=>{quitting=true});
            app.whenReady().then(()=>{
              protocol.handle('app',()=>new Response(fs.readFileSync(path.join(__dirname,'index.html')),{headers:{'content-type':'text/html; charset=utf-8'}}));
              Menu.setApplicationMenu(null);
              const icon=nativeImage.createFromPath(path.join(__dirname,'icon.png'));
              const hidden=process.argv.includes('--hidden');
              win=new BrowserWindow({width:1100,height:820,minWidth:420,minHeight:600,show:false,backgroundColor:'#0b0c10',title:'Forge',icon:icon,autoHideMenuBar:true,
                webPreferences:{preload:path.join(__dirname,'preload.js'),autoplayPolicy:'no-user-gesture-required'}});
              win.once('ready-to-show',()=>{if(!hidden)win.show()});
              win.loadURL('app://forge/');
              win.on('close',e=>{if(!quitting){e.preventDefault();win.hide()}});
              tray=new Tray(icon.resize({width:16,height:16}));
              tray.setToolTip('Forge');
              const build=()=>Menu.buildFromTemplate([
                {label:'Open Forge',click:show},
                {label:'Start with Windows',type:'checkbox',checked:app.getLoginItemSettings().openAtLogin,click:i=>app.setLoginItemSettings({openAtLogin:i.checked,args:['--hidden']})},
                {type:'separator'},
                {label:'Quit',click:()=>{quitting=true;app.quit()}}]);
              tray.setContextMenu(build());
              tray.on('click',show);
              const flag=path.join(app.getPath('userData'),'autostart.flag');
              if(!fs.existsSync(flag)){try{fs.writeFileSync(flag,'1');app.setLoginItemSettings({openAtLogin:true,args:['--hidden']})}catch(e){}}
            });
          }
          EOT
          cat > preload.js <<'EOT'
          const {contextBridge,ipcRenderer}=require('electron');
          contextBridge.exposeInMainWorld('ForgeDesk',{show:()=>ipcRenderer.send('show')});
          EOT
          cat > package.json <<'EOT'
          {"name":"forge","version":"1.0.0","description":"Forge life system","author":"Forge","main":"main.js",
          "devDependencies":{"electron":"^31.0.0","electron-builder":"^24.13.3"},
          "build":{"appId":"com.forge.discipline","productName":"Forge","files":["main.js","preload.js","index.html","icon.png"],
          "win":{"target":"nsis","icon":"icon.png"},"nsis":{"oneClick":true,"perMachine":false,"allowToChangeInstallationDirectory":false}}}
          EOT
          echo "" | base64 -d > icon.png
          npm version 1.0.${{ github.run_number }} --no-git-tag-version
          npm install
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-PC
          path: desktop/dist/*.exe
