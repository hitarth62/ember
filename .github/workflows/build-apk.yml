name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Ember com.ember.streak --web-dir www
          npx cap add android
          sed -i 's|<item name="windowActionBar">false</item>|&<item name="android:statusBarColor">#070b18</item><item name="android:navigationBarColor">#070b18</item>|' android/app/src/main/res/values/styles.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
